name: Build

on:
  workflow_dispatch: # allows manual triggering

  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  QT_VERSION: "6.7.2"
  DIRECTORY: "SmartFileOrganizer"

jobs:
  dist:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [windows_x64]
        include:
          - build: windows_x64
            os: windows-latest

    steps:
      - if: ${{ matrix.os == 'windows-latest' }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{env.QT_VERSION}}
          arch: win64_mingw

      - if: ${{ matrix.os != 'windows-latest' }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{env.QT_VERSION}}

      - name: Install Build Dependencies
        shell: bash
        run: |
          if [[ ${{ matrix.build }} == "macos_arm64" ]]; then
            brew upgrade
          elif [[ ${{ matrix.build }} == "windows_x64" ]]; then
            echo "Nothing to do for now..."
          elif [[ ${{ matrix.build }} == "linux_x64" ]]; then
            sudo apt-get update
            sudo apt-get install ninja-build cmake
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Download AI Models
        shell: bash
        run: |
          mkdir -p models
          echo "Downloading Qwen..."
          curl -L -o models/qwen2.5-3b-instruct-q4_k_m.gguf "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf"
          
          echo "Downloading CLIP Vision..."
          curl -L -o models/clip-vision.onnx "https://huggingface.co/Lednik7/CLIP-ONNX/resolve/main/visual.onnx"
          
          echo "Downloading CLIP Text..."
          curl -L -o models/clip-text.onnx "https://huggingface.co/Lednik7/CLIP-ONNX/resolve/main/textual.onnx"

      - name: Build release package
        shell: bash
        run: |
          mkdir -p build dist/${{ matrix.build }}
          if [[ ${{ matrix.build }} == "windows_x64" ]]; then
            # Install Inno Setup & 7-Zip
            choco install innosetup 7zip

            # Compile
            cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release

            # Run packaging script (compiles installer)
            pwsh ./package_windows.ps1
            
            # Move the generated setup exe to dist
            mv SmartFile_Setup_*.exe dist/${{ matrix.build }}/
            
          elif [[ ${{ matrix.build }} == "macos_arm64" ]]; then
            cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release
            ninja -C build
            cp build/SmartFileOrganizer dist/${{ matrix.build }}
            cp -r build/bin/* dist/${{ matrix.build }}
          elif [[ ${{ matrix.build }} == "linux_x64" ]]; then
            cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="$CFLAGS -march=x86-64-v2" -DCMAKE_CXX_FLAGS="$CXXFLAGS -march=x86-64-v2"
            ninja -C build
            cp build/SmartFileOrganizer dist/${{ matrix.build }}
            cp -r build/bin/* dist/${{ matrix.build }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.build }}
          path: |
            dist/${{ matrix.build }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [dist]
    steps:
      - uses: actions/download-artifact@v4

      - name: Calculate tag name
        run: |
          name=dev
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            name=${GITHUB_REF:10}
          fi
          echo val=$name >> $GITHUB_OUTPUT
          echo TAG=$name >> $GITHUB_ENV
        id: tagname

      - name: Build archive
        run: |
          set -ex

          rm -rf tmp
          mkdir tmp
          mkdir dist

          for dir in artifact*; do
            platform=${dir#"artifact-"}
            unset exe
            if [[ $platform =~ "windows" ]]; then
              # Zip the folder anyway for backup (optional)
              zip -r dist/${platform}.zip $dir
              # Copy the Installer EXE directly so it appears as a standalone asset
              find $dir -name "*.exe" -exec cp {} dist/ \;
            elif [[ $platform =~ "macos" ]]; then
              zip -r dist/${platform}.zip $dir
              # TODO: make dmg
            elif [[ $platform =~ "linux" ]]; then
              zip -r dist/${platform}.zip $dir
              # TODO: make appimage
            fi
          done

      - name: Upload as artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/* # Zip the binaries under arti folder

      - name: Upload binaries to release
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/* #Release the binary under dist folder
          file_glob: true
          tag: ${{ steps.tagname.outputs.val }}
          overwrite: true

      - name: Extract version
        id: extract-version
        run: |
          printf "%s=%s\n" >> $GITHUB_OUTPUT tag-name "${GITHUB_REF#refs/tags/}"
